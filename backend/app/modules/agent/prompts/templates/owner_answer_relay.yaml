    Shop-la irundhu update: {{ answer }}
  ta: |-
    கடையிலிருந்து தகவல்: {{ answer }}
  hi-en: |-
    Shop se update: {{ answer }}
  hi: |-
    दुकान से अपडेट: {{ answer }}
