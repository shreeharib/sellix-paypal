id: payment_link
version: 3
description: "Sent by code right after an order is placed, with the payment link (Razorpay: UPI, card, net banking, wallet; or the shop's own UPI link)."
texts:
  en: |-
    Order {{ number }} is placed: {{ total }}. Pay here (UPI, card or net banking): {{ link }}
    We're holding your items for {{ hold_minutes }} minutes.
  ta-en: |-
    Order {{ number }} confirm aachu: {{ total }}. Inga pay pannunga (UPI, card illa net banking): {{ link }}
    {{ hold_minutes }} nimisham ungalukkaga vechirukkom.
  ta: |-
    ஆர்டர் {{ number }} உறுதியானது: {{ total }}. இங்கே பணம் செலுத்துங்கள் (UPI, கார்டு அல்லது நெட் பேங்கிங்): {{ link }}
    {{ hold_minutes }} நிமிடம் உங்களுக்காக வைத்திருக்கிறோம்.
  hi-en: |-
    Order {{ number }} ho gaya: {{ total }}. Yahan pay kariye (UPI, card ya net banking): {{ link }}
    {{ hold_minutes }} minute ke liye aapke items rakhe hain.
  hi: |-
    ऑर्डर {{ number }} हो गया: {{ total }}। यहाँ भुगतान करें (UPI, कार्ड या नेट बैंकिंग): {{ link }}
    {{ hold_minutes }} मिनट के लिए आपका सामान रखा है।
