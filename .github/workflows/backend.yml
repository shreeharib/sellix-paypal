name: backend

on:
  pull_request:
    paths: ["backend/**", "supabase/**", ".github/workflows/backend.yml"]
  push:
    branches: [main]
    paths: ["backend/**", "supabase/**", ".github/workflows/backend.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The tests build a fresh database from supabase/migrations; missing Postgres fails CI.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sellix_test
      REQUIRE_DB_TESTS: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run basedpyright
      - name: Tests
        run: uv run pytest
