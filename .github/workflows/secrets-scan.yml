name: secrets-scan

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Needed only if the repo is owned by a GitHub organization (free key from gitleaks.io):
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
