name: sellix_merchant
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  flutter_web_auth_2: ^5.1.0
  crypto: ^3.0.7
  intl: ^0.20.3
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  flutter_svg: ^2.2.1
  flutter_tabler_icons: ^1.43.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi-Variable.ttf
        - asset: assets/fonts/Satoshi-VariableItalic.ttf
          style: italic
    - family: NotoSansTamil
      fonts:
        - asset: assets/fonts/NotoSansTamil-Variable.ttf
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Variable.ttf
